# Copy to .github/workflows/pr-qa.yml in the product repo (must be on the default branch).
name: PR QA

on:
  issue_comment:
    types: [created]

jobs:
  qa:
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/qa')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: scaler-ai/pr-qa/.github/workflows/run.yml@main
    # Pass only the QA secrets by name; do not use `secrets: inherit`, which would
    # hand over every secret in this repo. A secret you have not created is passed
    # as empty and ignored, so every supported one is listed here.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      QA_JWT_SECRET: ${{ secrets.QA_JWT_SECRET }}
      QA_LOGS_API_KEY: ${{ secrets.QA_LOGS_API_KEY }}
      QA_LOGS_AWS_ACCESS_KEY_ID: ${{ secrets.QA_LOGS_AWS_ACCESS_KEY_ID }}
      QA_LOGS_AWS_SECRET_ACCESS_KEY: ${{ secrets.QA_LOGS_AWS_SECRET_ACCESS_KEY }}
